<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metraje Sel</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Modal con un párrafo para el resultado y un botón para cerrar -->
  <dialog class="escogido" id="modal-resultado">
    <p id="texto-escogido"></p>
    <button type="button" id="aceptar-modal">Aceptar</button>
    <button type="button" id="cerrar-modal">Cerrar</button>
  </dialog>

  <h3>Selector de Serie o Película para ver</h3>
  <form action="" class="metraje" method="POST" id="form-metraje">

    <label for="nombre">Nombre</label>
    <input type="text" class="nombre" id="nombre" placeholder="Bullet Train" required>

    <label for="tipo">Tipo</label>
    <select name="tipo" id="tipo" class="tipo" required>
      <option value="" disabled selected>Selecciona un tipo de metraje...</option>
      <option value="Pelicula">Pelicula</option>
      <option value="Serie">Serie</option>
    </select>

    <div class="botones">
      <button type="submit" class="guardar">Guardar</button>
      <button type="button" class="escoger">Escoger al azar</button>
    </div>
    
  </form>

  <ul class="lista-pelis" id="lista-pelis"></ul>
</body>
</html>
